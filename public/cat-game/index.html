<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>米利 Milli · 试玩版</title>
<meta name="description" content="米利 Milli — 一只小猫，和很久以前的一个早晨。Zoya Yin 的游戏试玩版。">
<meta name="theme-color" content="#7e9c6c">
<link rel="icon" href="/cat-game/TemplateData/favicon.ico">
<link rel="preload" href="/cat-game/TemplateData/rounded-bold.woff2" as="font" type="font/woff2" crossorigin>
<style>
  /* The game's title screen: the sage green ground, the cat's cream, the pink inside her ears, the darker green of
     her shadow; the same soft rounded type (Resource Han Rounded, SIL OFL). */
  @font-face { font-family: "Milli Rounded"; src: url("/cat-game/TemplateData/rounded-medium.woff2") format("woff2"); font-weight: 400 500; font-display: swap; }
  @font-face { font-family: "Milli Rounded"; src: url("/cat-game/TemplateData/rounded-bold.woff2") format("woff2"); font-weight: 600 800; font-display: swap; }
  :root { --sage: #7e9c6c; --sage-d: #6c8a5a; --sage-dd: #5b7649; --cream: #f7e6dc; --pink: #f6baae; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--sage); color: var(--cream);
    font: 500 15px/1.5 "Milli Rounded", "PingFang SC", "Microsoft YaHei", "Segoe UI", system-ui, sans-serif; }
  body { display: flex; flex-direction: column; overflow-x: hidden; }
  header { display: flex; align-items: baseline; gap: 14px; padding: 22px 36px 18px; flex-wrap: wrap; }
  .logo { display: flex; align-items: baseline; gap: 10px; text-decoration: none; color: var(--cream); text-shadow: 1px 2px 0 rgba(91, 118, 73, .55); }
  .logo b { font-size: 30px; font-weight: 700; letter-spacing: .04em; }
  .logo span { font-size: 19px; font-weight: 700; color: var(--pink); }
  .tag { font-size: 13px; color: var(--cream); opacity: .75; }
  header a.back { margin-left: auto; color: var(--cream); opacity: .85; text-decoration: none; font-size: 14px; }
  header a.back:hover, header a.back:focus-visible { color: var(--pink); opacity: 1; outline: none; }
  main { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 6px 36px; }
  #stage { position: relative; aspect-ratio: 16 / 10; width: min(100%, calc((100vh - 230px) * 1.6)); background: var(--sage-d);
    border-radius: 20px; overflow: hidden; box-shadow: 0 0 0 3px rgba(247, 230, 220, .18), 0 14px 34px rgba(60, 82, 48, .35); }
  #unity-canvas { display: block; width: 100%; height: 100%; outline: none; }
  /* Loading: the title illustration itself, the progress where the menu will appear. */
  #loading { position: absolute; inset: 0; background: var(--sage) url("/cat-game/TemplateData/home.jpg") center / cover no-repeat; }
  #loading .panel { position: absolute; left: 56%; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; align-items: flex-start; gap: 12px;
    text-shadow: 1px 2px 0 rgba(91, 118, 73, .55); }
  #loading .name { font-size: clamp(34px, 6vw, 72px); font-weight: 700; line-height: 1; }
  #loading .sub { font-size: clamp(16px, 2.2vw, 26px); font-weight: 700; color: var(--pink); margin-top: -4px; }
  #loading .row { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
  #loading .paw { width: 30px; height: 30px; animation: hop 1.1s ease-in-out infinite; filter: drop-shadow(1px 2px 0 rgba(91, 118, 73, .55)); }
  @keyframes hop { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
  #msg { font-size: clamp(13px, 1.5vw, 17px); }
  #bar { width: clamp(150px, 22vw, 260px); height: 8px; background: rgba(91, 118, 73, .55); border-radius: 999px; overflow: hidden; }
  #bar i { display: block; height: 100%; width: 0; background: var(--pink); border-radius: 999px; transition: width .2s; }
  #pct { font-size: 13px; opacity: .85; font-variant-numeric: tabular-nums; }
  footer { display: flex; align-items: center; justify-content: center; gap: 10px 22px; flex-wrap: wrap; padding: 24px 36px 26px; color: var(--cream); font-size: 13px; }
  footer span { opacity: .92; }
  kbd { font: 700 12px "Milli Rounded", ui-monospace, Consolas, monospace; min-width: 22px; display: inline-block; text-align: center; padding: 1px 7px; margin-right: 2px; border-radius: 999px;
    color: var(--sage-dd); background: var(--pink); box-shadow: 0 2px 0 var(--sage-dd); }
  button { font: 700 14px "Milli Rounded", sans-serif; color: var(--sage-dd); background: var(--cream); border: 0; border-radius: 999px; padding: 7px 18px; cursor: pointer;
    box-shadow: 0 3px 0 var(--sage-dd); transition: transform .12s, background .12s; }
  button:hover, button:focus-visible { background: var(--pink); outline: none; transform: translateY(-1px); }
  button.survey { background: var(--pink); }
  button.survey:hover, button.survey:focus-visible { background: var(--cream); }
  button:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--sage-dd); }
  #mobile { display: none; position: absolute; inset: 0; align-items: center; justify-content: center; text-align: center; padding: 24px; background: var(--sage); color: var(--cream); }
  @media (max-width: 640px) { #loading .panel { left: 50%; transform: translate(-50%, -50%); align-items: center; } }
  @media (prefers-reduced-motion: reduce) { #loading .paw { animation: none; } button { transition: none; } }
</style>
</head>
<body>
<header>
  <a class="logo" href="/cat-game/"><b>米利</b><span>Milli</span></a>
  <span class="tag">试玩版 · Demo</span>
  <a class="back" href="/">← 返回作品集 / Portfolio</a>
</header>
<main>
  <div id="stage">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading">
      <div class="panel">
        <div class="name">米利</div>
        <div class="sub">Milli</div>
        <div class="row">
          <svg class="paw" viewBox="0 0 64 64" aria-hidden="true"><g fill="#f7e6dc"><ellipse cx="32" cy="42" rx="15" ry="12"/><circle cx="13" cy="28" r="6.5"/><circle cx="24" cy="16" r="7"/><circle cx="40" cy="16" r="7"/><circle cx="51" cy="28" r="6.5"/></g></svg>
          <div id="msg">米利正在醒来… Waking Milli up</div>
        </div>
        <div id="bar"><i></i></div><div id="pct">0%</div>
      </div>
    </div>
    <div id="mobile"><div>这个试玩版需要键盘，请在电脑浏览器中打开。<br>This demo needs a keyboard — please open it on a computer.</div></div>
  </div>
</main>
<footer>
  <span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 移动 Move</span>
  <span><kbd>Space</kbd> 跳 Jump</span>
  <span><kbd>E</kbd> 叼 / 放下 Carry</span>
  <span><kbd>F</kbd> 拍爪 Swipe</span>
  <span><kbd>M</kbd> 喵 Meow</span>
  <span><kbd>Tab</kbd> 任务清单 Tasks</span>
  <span>按住 <kbd>R</kbd> 看更远 Hold to see more</span>
  <span><kbd>L</kbd> 中 / EN</span>
  <span>先点一下画面再操作 · Click the game first</span>
  <button id="fs" type="button">全屏 Fullscreen</button>
  <button id="survey" type="button" class="survey" hidden>试玩问卷 Survey</button>
</footer>
<script>
  // The play-test survey (Tally). Opens by itself once the player reaches the end of the game (the game calls
  // milliSurvey.finished), and any time from the footer button. Put the Tally form id here to switch it on.
  var SURVEY_FORM_ID = "peDW8y";
  window.milliSurvey = {
    open: function (reason, lang) {
      if (!SURVEY_FORM_ID) return;
      if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen();
      var go = function () {
        window.Tally.openPopup(SURVEY_FORM_ID, { layout: "modal", width: 720, overlay: true, emoji: { text: "🐾", animation: "wave" },
          hiddenFields: { reached_end: reason === "end" ? "yes" : "no", game_lang: lang || "" } });
      };
      if (window.Tally) go(); else {
        var t = document.createElement("script"); t.src = "https://tally.so/widgets/embed.js"; t.onload = go; document.body.appendChild(t);
      }
    },
    finished: function (lang) {
      var key = "milli-survey-shown";
      try { if (sessionStorage.getItem(key)) return; sessionStorage.setItem(key, "1"); } catch (e) {}
      setTimeout(function () { window.milliSurvey.open("end", lang); }, 2500);
    }
  };
  if (SURVEY_FORM_ID) {
    var sb = document.getElementById("survey"); sb.hidden = false;
    sb.onclick = function () { window.milliSurvey.open("button", ""); };
  }
  var canvas = document.getElementById("unity-canvas");
  if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
    document.getElementById("loading").style.display = "none";
    document.getElementById("mobile").style.display = "flex";
  } else {
    var script = document.createElement("script");
    script.src = "/cat-game/Build/cat-game.loader.js";
    script.onload = function () {
      createUnityInstance(canvas, {
        dataUrl: "/cat-game/Build/cat-game.data.unityweb",
        frameworkUrl: "/cat-game/Build/cat-game.framework.js.unityweb",
        codeUrl: "/cat-game/Build/cat-game.wasm.unityweb",
        streamingAssetsUrl: "/cat-game/StreamingAssets",
        companyName: "Zoya Yin",
        productName: "Milli",
        productVersion: "demo",
      }, function (progress) {
        var p = Math.round(progress * 100);
        document.querySelector("#bar i").style.width = p + "%";
        document.getElementById("pct").textContent = p + "%";
      }).then(function (instance) {
        document.getElementById("loading").style.display = "none";
        canvas.focus();
        document.getElementById("fs").onclick = function () { instance.SetFullscreen(1); };
      }).catch(function (message) {
        document.getElementById("msg").textContent = "加载失败 Failed to load: " + message;
      });
    };
    document.body.appendChild(script);
  }
</script>
</body>
</html>
