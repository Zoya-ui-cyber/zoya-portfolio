<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>米利 Millie · 试玩版</title>
<meta name="description" content="米利 Millie — 一只小猫，和很久以前的一个早晨。Zoya Yin 的游戏试玩版。">
<link rel="icon" href="/cat-game/TemplateData/favicon.ico">
<style>
  /* Same palette as the game's title screen: warm cream, oat, one soft coral accent, warm brown ink. */
  :root { --bg: #f8f1e6; --paper: #fffbf5; --ink: #4e4039; --soft: #8c7d72; --line: #e7d5b9; --coral: #e8958a; --coral-d: #cf7c70; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font: 15px/1.5 "PingFang SC", "Microsoft YaHei", "Segoe UI", system-ui, sans-serif; }
  body { display: flex; flex-direction: column; overflow-x: hidden; }
  header { display: flex; align-items: baseline; gap: 12px; padding: 16px 24px 8px; flex-wrap: wrap; }
  .logo { display: flex; align-items: baseline; gap: 10px; text-decoration: none; color: var(--ink); }
  .logo b { font-size: 28px; font-weight: 800; letter-spacing: .04em; }
  .logo span { font-size: 17px; color: var(--coral); }
  .tag { font-size: 13px; color: var(--soft); }
  header a.back { margin-left: auto; color: var(--soft); text-decoration: none; font-size: 14px; }
  header a.back:hover, header a.back:focus-visible { color: var(--coral-d); outline: none; }
  main { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 4px 24px; }
  #stage { position: relative; aspect-ratio: 16 / 10; width: min(100%, calc((100vh - 140px) * 1.6)); background: var(--line);
    border-radius: 18px; overflow: hidden; box-shadow: 0 10px 30px rgba(110, 85, 60, .12); }
  #unity-canvas { display: block; width: 100%; height: 100%; outline: none; }
  #loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: var(--bg); }
  #loading .paw { width: 44px; height: 44px; animation: hop 1.1s ease-in-out infinite; }
  @keyframes hop { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  #bar { width: 220px; height: 6px; background: var(--line); border-radius: 999px; overflow: hidden; }
  #bar i { display: block; height: 100%; width: 0; background: var(--coral); border-radius: 999px; transition: width .2s; }
  #pct { color: var(--soft); font-size: 13px; font-variant-numeric: tabular-nums; }
  footer { display: flex; align-items: center; justify-content: center; gap: 8px 18px; flex-wrap: wrap; padding: 10px 24px 18px; color: var(--soft); font-size: 13px; }
  kbd { font: 600 12px ui-monospace, Consolas, monospace; min-width: 22px; text-align: center; padding: 1px 6px; border-radius: 6px; color: var(--ink);
    background: var(--paper); border: 1px solid var(--line); border-bottom-width: 2px; }
  button { font: 600 14px inherit; font-family: inherit; color: #fff; background: var(--coral); border: 0; border-radius: 999px; padding: 6px 16px; cursor: pointer; }
  button:hover, button:focus-visible { background: var(--coral-d); outline: none; }
  #mobile { display: none; position: absolute; inset: 0; align-items: center; justify-content: center; text-align: center; padding: 24px; background: var(--bg); color: var(--ink); }
  @media (prefers-reduced-motion: reduce) { #loading .paw { animation: none; } }
</style>
</head>
<body>
<header>
  <a class="logo" href="/cat-game/"><b>米利</b><span>Millie</span></a>
  <span class="tag">试玩版 · Demo</span>
  <a class="back" href="/">← 返回作品集 / Portfolio</a>
</header>
<main>
  <div id="stage">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading">
      <svg class="paw" viewBox="0 0 64 64" aria-hidden="true"><g fill="#e8958a"><ellipse cx="32" cy="40" rx="14" ry="12"/><circle cx="15" cy="24" r="6"/><circle cx="25" cy="14" r="6"/><circle cx="39" cy="14" r="6"/><circle cx="49" cy="24" r="6"/></g></svg>
      <div id="msg">米利正在醒来… Waking Millie up</div>
      <div id="bar"><i></i></div><div id="pct">0%</div>
    </div>
    <div id="mobile"><div>这个试玩版需要键盘，请在电脑浏览器中打开。<br>This demo needs a keyboard — please open it on a computer.</div></div>
  </div>
</main>
<footer>
  <span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 移动 Move</span>
  <span><kbd>Space</kbd> 跳 Jump</span>
  <span><kbd>E</kbd> 叼 / 放下 Carry</span>
  <span><kbd>F</kbd> 拍爪 Swipe</span>
  <span><kbd>M</kbd> 喵 Meow</span>
  <span><kbd>L</kbd> 中 / EN</span>
  <span>先点一下画面再操作 · Click the game first</span>
  <button id="fs" type="button">全屏 Fullscreen</button>
</footer>
<script>
  var canvas = document.getElementById("unity-canvas");
  if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
    document.getElementById("loading").style.display = "none";
    document.getElementById("mobile").style.display = "flex";
  } else {
    var script = document.createElement("script");
    script.src = "/cat-game/Build/cat-game.loader.js";
    script.onload = function () {
      createUnityInstance(canvas, {
        dataUrl: "/cat-game/Build/cat-game.data.unityweb",
        frameworkUrl: "/cat-game/Build/cat-game.framework.js.unityweb",
        codeUrl: "/cat-game/Build/cat-game.wasm.unityweb",
        streamingAssetsUrl: "/cat-game/StreamingAssets",
        companyName: "Zoya Yin",
        productName: "Millie",
        productVersion: "demo",
      }, function (progress) {
        var p = Math.round(progress * 100);
        document.querySelector("#bar i").style.width = p + "%";
        document.getElementById("pct").textContent = p + "%";
      }).then(function (instance) {
        document.getElementById("loading").style.display = "none";
        canvas.focus();
        document.getElementById("fs").onclick = function () { instance.SetFullscreen(1); };
      }).catch(function (message) {
        document.getElementById("msg").textContent = "加载失败 Failed to load: " + message;
      });
    };
    document.body.appendChild(script);
  }
</script>
</body>
</html>
