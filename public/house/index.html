<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f8f8f4"><meta name="description" content="Zoya Yin 的空间设计作品集：一栋可以探索的剖面住宅。"><title>Zoya Yin — A House of Work</title><link rel="stylesheet" href="style.css"></head><body>
<header><a href="#" class="wordmark" aria-label="回到房屋全景">ZOYA YIN</a><nav aria-label="主导航"><button data-room="about">关于我</button><button data-room="portfolio">空间类作品</button><button data-room="other">平面类作品</button><button data-room="awards">荣誉与证书</button><button id="nav-guest">留言</button></nav></header>
<main><section id="world" aria-label="四个房间组成的互动剖面住宅"><div id="canvas" tabindex="0" role="group" aria-label="3D 房屋；进入房间后可拖动调整视角，方向键转动，加减键缩放"></div><img id="fallback" src="concept.png" alt="两层错层房屋剖面，上层卧室和荣誉室，下层书房与家庭影院，中间由带天窗的楼梯连接。" hidden><div id="loading" role="status">正在打开这栋房屋<span></span></div>
<div class="room-label left" id="label-about"><button data-room="about"><span>01 / ABOUT ME</span><small>卧室 · 关于我</small></button></div>
<div class="room-label left" id="label-portfolio"><button data-room="portfolio"><span>02 / SPATIAL DESIGN</span><small>书房 · 空间类作品</small></button></div>
<div class="room-label right" id="label-awards"><button data-room="awards"><span>04 / AWARDS & CREDENTIALS</span><small>荣誉室 · 获奖与资格</small></button></div>
<div class="room-label right" id="label-other"><button data-room="other"><span>03 / GRAPHIC DESIGN</span><small>影院 · 平面类作品</small></button></div>
<div id="room-toolbar" hidden><div><button id="back-room">← 房屋全景</button><p id="room-caption"></p></div><button id="directory-toggle" aria-expanded="false" aria-controls="detail">展开目录 +</button></div>
<div id="room-controls" hidden><div class="object-actions" aria-label="房间里的可交互物件" id="object-actions"></div><div class="camera-controls" aria-label="调整房间视角"><button id="turn-left" aria-label="向左查看">↶</button><button id="turn-right" aria-label="向右查看">↷</button><button id="zoom-in" aria-label="拉近视角">＋</button><button id="zoom-out" aria-label="拉远视角">−</button><button id="view-reset">视角归位</button></div><p id="interaction-hint" aria-live="polite">拖动调整视角 · 滚轮缩放 · 点击家具探索</p></div>
</section><footer><span class="edition">A HOUSE OF WORK / 2026</span><div class="explore">Explore a room<span>选择一个房间，走近看看</span><button id="guest-open">树下留言 ↗</button></div><button id="reset" hidden>← 返回全景</button><button id="motion" aria-pressed="false">动态视角：开</button></footer></main>
<aside id="detail" aria-labelledby="detail-title" hidden><button class="close" aria-label="收起目录">×</button><p class="eyebrow" id="detail-number"></p><h1 id="detail-title"></h1><div id="detail-body"></div><button class="return">收起目录，继续探索</button></aside>
<dialog id="photo-dialog" aria-labelledby="photo-title"><button id="photo-close" aria-label="关闭照片">×</button><p class="eyebrow">ON THE BEDSIDE TABLE</p><h2 id="photo-title">我的照片</h2><img id="portrait-preview" alt="选择的个人照片" hidden><div id="photo-empty">相框里还没有照片</div><label class="photo-upload" for="portrait-file">选择一张照片</label><input id="portrait-file" type="file" accept="image/png,image/jpeg,image/webp" hidden><p id="photo-note" role="status">从电脑选择照片，即可放入床头相框。仅用于本次预览。</p></dialog>
<dialog id="guestbook-dialog" aria-labelledby="guest-title"><button id="guest-close" aria-label="关闭留言簿">×</button><p class="eyebrow">BENEATH THE TREE</p><h2 id="guest-title">树下留言</h2><p class="muted">留言仅用于本次预览，关闭或刷新页面后清空。</p><form id="guest-form"><label for="guest-name">姓名</label><input id="guest-name" name="visitor" maxlength="40" autocomplete="name" required placeholder="如何称呼你"><label for="guest-message">留言</label><textarea id="guest-message" name="message" rows="3" maxlength="500" required placeholder="想留下的一句话…"></textarea><button type="submit">留下留言</button></form><p id="guest-status" role="status"></p><div class="guest-list-heading"><h3>留言簿</h3><button id="guest-manage" aria-pressed="false">管理预览</button></div><div id="guest-list"></div></dialog>
<dialog id="contact-dialog" aria-labelledby="contact-title"><button id="contact-close" aria-label="关闭联系方式">×</button><p class="eyebrow">ON THE TERRACE</p><h2 id="contact-title">联系我</h2><dl><dt>邮箱</dt><dd>待补充</dd><dt>社交媒体</dt><dd>账号待补充</dd></dl></dialog><script type="module" src="app.js"></script></body></html>
